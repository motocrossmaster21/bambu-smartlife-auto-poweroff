name: bambuoff
services:
  bambuoff:
    build: .
    image: bambuoff:local
    restart: unless-stopped
    environment:
      MODE: ${MODE:-demo}
      BAMBU_REGION: ${BAMBU_REGION:-global}
      BAMBU_SERIAL: ${BAMBU_SERIAL:-}
      BAMBU_USERNAME: ${BAMBU_USERNAME:-}
      BAMBU_ACCESS_TOKEN: ${BAMBU_ACCESS_TOKEN:-}
      TUYA_DEVICE_ID: ${TUYA_DEVICE_ID:-}
      TUYA_DEVICE_SECRET: ${TUYA_DEVICE_SECRET:-}
      TUYA_MQTT_HOST: ${TUYA_MQTT_HOST:-m1.tuyaeu.com}
      TUYA_PROPERTY_CODE: ${TUYA_PROPERTY_CODE:-bambu_off}
      SAFE_NOZZLE_TEMPERATURE: ${SAFE_NOZZLE_TEMPERATURE:-50}
      STABLE_SECONDS: ${STABLE_SECONDS:-30}
      PULSE_SECONDS: ${PULSE_SECONDS:-30}
      MAX_DATA_AGE_SECONDS: ${MAX_DATA_AGE_SECONDS:-60}
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - bambuoff-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  bambuoff-data:
