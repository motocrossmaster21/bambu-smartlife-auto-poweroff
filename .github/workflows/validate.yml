name: Validate BambuOff
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example up -d --build
      - name: Check complete demo cycle without cloud credentials
        run: python scripts/smoke_demo.py
      - if: always()
        run: docker compose --env-file .env.example down
