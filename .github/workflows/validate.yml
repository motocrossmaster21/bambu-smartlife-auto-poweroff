name: Validate configuration and safety policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare.py
      - run: docker compose --env-file .env.example config --quiet
      - name: Validate with Home Assistant itself (no accounts or device access)
        run: docker compose --env-file .env.example run --rm --no-deps --entrypoint python homeassistant -m homeassistant --script check_config --config /config
