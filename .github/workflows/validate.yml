name: Validate BambuOff
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example up -d --build --wait --wait-timeout 90
      - name: Check complete demo cycle without cloud credentials
        run: python scripts/smoke_demo.py
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps --all
          docker compose --env-file .env.example logs --no-color --tail=100
      - if: always()
        run: docker compose --env-file .env.example down
