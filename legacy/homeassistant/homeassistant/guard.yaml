status_entity: !env_var P1S_STATUS_ENTITY sensor.replace_with_p1s_print_status
nozzle_entity: !env_var P1S_NOZZLE_ENTITY sensor.replace_with_p1s_nozzle_temperature
nozzle_target_entity: !env_var P1S_NOZZLE_TARGET_ENTITY sensor.replace_with_p1s_nozzle_target
bed_entity: !env_var P1S_BED_ENTITY sensor.replace_with_p1s_bed_temperature
bed_target_entity: !env_var P1S_BED_TARGET_ENTITY sensor.replace_with_p1s_bed_target
progress_entity: !env_var P1S_PROGRESS_ENTITY sensor.replace_with_p1s_print_progress
online_entity: !env_var P1S_ONLINE_ENTITY binary_sensor.replace_with_p1s_online
plug_entity: !env_var P1S_PLUG_ENTITY switch.replace_with_p1s_power_plug
bridge_entry_id: !env_var TUYA_BRIDGE_ENTRY_ID replace_with_bridge_config_entry_id
safe_temperature: !env_var SAFE_NOZZLE_TEMPERATURE 50
stable_seconds: !env_var STABLE_SECONDS 30
max_age_seconds: !env_var MAX_DATA_AGE_SECONDS 60
off_timeout_seconds: !env_var POWER_OFF_TIMEOUT_SECONDS 20
